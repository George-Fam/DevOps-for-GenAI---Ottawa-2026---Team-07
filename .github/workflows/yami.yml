name: Yami Security Gate

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  yami:
    runs-on: ubuntu-latest
    steps:
      # audit-only: logs egress but does not block it (same for every
      # harden-runner step in this file).
      # TODO: switch to egress-policy: block with allowed-endpoints list later.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # fetch-depth 0 (not the default shallow depth-1 checkout) so
          # `origin/<base>` exists locally - Harness needs it to compute
          # changedFiles()/diffsFor() for the risk context packet.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b36c23c0d998641eff861008f374ee103c25ac73 # v4.4.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The action's Dockerfile does `COPY target/yami.jar` - it expects the jar
      # already built, it doesn't build it itself.
      - name: Build yami.jar
        run: make package

      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: policies/yami.yml
          # Fallback IAM key auth (see action.yml) - switch to OIDC
          # (permissions: id-token: write + aws-actions/configure-aws-credentials)
          # once a Bedrock-scoped role is available; these are no-ops (empty) until
          # the AWS_* secrets are added to the repo.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # opencode-serve.log carries the real provider/model error (bad model ARN,
      # missing IAM permission, Bedrock throttling) behind what the Harness
      # otherwise only sees as a bare client-side timeout - see issue #43.
      # if: always() so this uploads on gate failure too, not just success.
      - name: Upload Yami audit trail
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yami-audit-trail
          path: |
            .yami-audit/opencode-serve.log
            .yami-audit/audit.json
          if-no-files-found: ignore
          retention-days: 14
