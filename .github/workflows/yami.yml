name: Yami Security Gate

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  yami:
    runs-on: ubuntu-latest
    steps:
      # audit-only: logs egress but does not block it (same for every
      # harden-runner step in this file).
      # TODO: switch to egress-policy: block with allowed-endpoints list later.
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # fetch-depth 0 (not the default shallow depth-1 checkout) so
          # `origin/<base>` exists locally - Harness needs it to compute
          # changedFiles()/diffsFor() for the risk context packet.
          fetch-depth: 0
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          policy-file: policies/yami.yml
          # Fallback IAM key auth (see action.yml) - switch to OIDC
          # (permissions: id-token: write + aws-actions/configure-aws-credentials)
          # once a Bedrock-scoped role is available; these are no-ops (empty) until
          # the AWS_* secrets are added to the repo.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
