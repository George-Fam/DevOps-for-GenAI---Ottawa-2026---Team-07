name: 'Yami Security Scanner'
description: 'AI-powered security scanner and remediation for IaC, CI/CD, and supply chain'
author: 'Team 07 — DevOps for GenAI Ottawa 2026'
branding:
  icon: shield
  color: red

inputs:
  github-token:
    description: 'GitHub token for PR creation and comments'
    required: true
  policy-file:
    description: 'Path to the Yami policy YAML file'
    required: false
    default: 'policies/yami.yml'
  audit-db:
    description: 'Path to the SQLite audit database'
    required: false
    default: 'yami-audit.db'
  scope:
    description: 'Comma-separated list of scan paths (overrides policy)'
    required: false
    default: ''
  replay-mode:
    description: 'Enable replay mode for testing (true/false)'
    required: false
    default: 'false'
  replay-file:
    description: 'Path to the replay JSONL file (for replay mode)'
    required: false
    default: 'replay.jsonl'
  aws-access-key-id:
    description: 'AWS IAM access key with bedrock:InvokeModel only, for the amazon-bedrock provider (fallback path — OIDC is preferred, see docs)'
    required: false
    default: ''
  aws-secret-access-key:
    description: 'AWS IAM secret access key, paired with aws-access-key-id'
    required: false
    default: ''
  aws-session-token:
    description: 'AWS session token, only needed for temporary/STS credentials'
    required: false
    default: ''
  aws-region:
    description: 'AWS region for the Bedrock provider (must match .opencode/opencode.json)'
    required: false
    default: 'us-east-1'

outputs:
  audit-json:
    description: 'Path to the generated audit.json file'
  findings-count:
    description: 'Number of findings detected'
  pr-url:
    description: 'URL of the remediation PR (if any)'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ inputs.github-token }}
    YAMI_POLICY_FILE: ${{ inputs.policy-file }}
    YAMI_AUDIT_DB: ${{ inputs.audit-db }}
    YAMI_SCOPE: ${{ inputs.scope }}
    YAMI_REPLAY_MODE: ${{ inputs.replay-mode }}
    YAMI_REPLAY_FILE: ${{ inputs.replay-file }}
    AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
    AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
    AWS_SESSION_TOKEN: ${{ inputs.aws-session-token }}
    AWS_REGION: ${{ inputs.aws-region }}
